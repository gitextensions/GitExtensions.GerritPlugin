#---------------------------------#
#      general configuration      #
#---------------------------------#

# version format
version: 3.2.0.{build}

# version suffix, if any (e.g. '-RC1', '-beta' otherwise '')
environment:
  version_suffix: ''

#---------------------------------#
#    environment configuration    #
#---------------------------------#

nuget:
  disable_publish_on_pr: true

# Build worker image (VM template)
image: Visual Studio 2022

# Install .NET 10 SDK (not pre-installed on AppVeyor VS2022 image)
install:
  - ps: |
      $installScript = "$env:TEMP\dotnet-install.ps1"
      Invoke-WebRequest -UseBasicParsing 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installScript
      & $installScript -JSonFile global.json
      $env:PATH = "$env:LOCALAPPDATA\Microsoft\dotnet;$env:PATH"
      [System.Environment]::SetEnvironmentVariable("PATH", $env:PATH, [System.EnvironmentVariableTarget]::Machine)
      dotnet restore .\GitExtensions.GerritPlugin.sln --verbosity quiet --nologo -bl:restore.binlog 2>&1
      if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }

# enable patching of Directory.Build.props
dotnet_csproj:
  patch: true
  file: '**\*.props'
  version: '{version}'
  assembly_version: '{version}'
  file_version: '{version}'
  informational_version: '{version}$(version_suffix)'
  package_version: '{version}$(version_suffix)'

#---------------------------------#
#       build configuration       #
#---------------------------------#

# build configuration
configuration: Release

build_script:
  - ps: |
      dotnet build .\GitExtensions.GerritPlugin.sln --configuration Release --no-restore --verbosity quiet --nologo -bl:msbuild.binlog 2>&1
      if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with exit code $LASTEXITCODE" }

#---------------------------------#
#      artifacts configuration    #
#---------------------------------#

artifacts:
- path: '**\GitExtensions.GerritPlugin.*.nupkg'
  name: NuGet
- path: '*.binlog'
  name: Binlogs

deploy:
- provider: NuGet
  name: production
  artifact: /GitExtensions.GerritPlugin.*\.nupkg/
  api_key:
    secure: Cu5mvoCI+zw9j2rAhznAyc+pqunWrR9EodrrLyufOGMF10YahzhvyQWfk72an+Fm
  skip_symbols: false
  on:
    appveyor_repo_tag: true
